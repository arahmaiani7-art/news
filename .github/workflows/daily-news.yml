name: Daily News Poster

on:
  schedule:
    # 北京时间 07:00 = UTC 23:00（前一天）。GitHub cron 一律按 UTC。
    # 为什么提前到 07:00：Actions 的 schedule 实测排队延迟 57–64 分钟
    # （原 08:15 的 cron 连续三天实际 09:12~09:19 才启动，已晚于插件 09:00 发送）。
    # 任务内部会轮询等待 60 秒接口发布当天数据（通常 07:48 前后）。
    #
    # 为什么还要第二条：schedule 除了延迟，高负载时还会整条丢弃。
    # 07:00 那条被丢时，08:00 这条仍有 45 分钟窗口等到数据，9 点前照样出图。
    # concurrency 的 cancel-in-progress: false 保证两条不会并发写同一份产物；
    # 前一条跑完后那条再触发时，数据已就绪，几十秒就结束。
    - cron: "0 23 * * *"   # 北京 07:00，主
    - cron: "0 0 * * *"    # 北京 08:00，主任务被 GitHub 丢弃时补位
  workflow_dispatch:
    inputs:
      wait_until:
        description: "等到接口发布当天数据的截止时间（北京时间 HH:MM，留空则立即出图不等待）"
        required: false
        default: ""

# 同一时刻只跑一个，避免两次部署互相覆盖
concurrency:
  group: daily-poster
  cancel-in-progress: false

permissions:
  contents: write    # 每天回写 latest.json 保活（见 Keep scheduled workflow alive）
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须 > 最坏情况总耗时，否则「触发越准点越必然失败」：
    #   等待窗口 07:00 → 08:45 = 105 分钟（准点启动时的最坏值）
    #   + 装 CJK 字体 / Python 依赖 / Chromium 约 3–5 分钟
    #   + 渲染与上传约 1 分钟
    # 给 130 分钟留出约 20 分钟余量。
    # 注意：等待窗口是从「触发时刻」算起的，而同一天两条 cron（07:00 / 08:00）
    # 各自独立计时，后者窗口更短，130 对两条都够。
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Chromium 截图中文必须要有 CJK 字体，否则渲染成方框
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Generate poster
        env:
          # 只有定时任务才值得等待当天数据；push / 手动触发要立刻出结果
          EVENT: ${{ github.event_name }}
          WAIT_UNTIL: ${{ inputs.wait_until }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python src/generate.py
          elif [ -n "$WAIT_UNTIL" ]; then
            python src/generate.py --wait "$WAIT_UNTIL"
          else
            python src/generate.py --no-wait
          fi

      # 生成失败时天然不会走到这里，上一次部署的 latest.png 继续在线提供服务
      - name: Verify output
        run: |
          test -f output/latest.png || { echo "latest.png 未生成"; exit 1; }
          python - <<'PY'
          import pathlib
          p = pathlib.Path("output/latest.png")
          head = p.read_bytes()[:8]
          assert head == b"\x89PNG\r\n\x1a\n", f"不是合法 PNG: {head!r}"
          print(f"OK {p} {p.stat().st_size} bytes")
          PY

      # GitHub 规定：公开仓库连续 60 天无活动，scheduled workflow 会被自动禁用
      # （邮件提醒，需手动 re-enable）。产物走 Pages artifact 不产生 commit，
      # 长期无 push 会让 cron 两个月后静默停掉。
      # 这里把 latest.json 回写仓库：既保活，也顺带留下每日新闻的版本历史。
      #
      # 重要：push 失败必须不致命。保活是附带目的，发图才是主线——
      # 若因远端有新提交导致 non-fast-forward 就中断 build，deploy 将不会执行，
      # 等于为了保活把每天的海报弄丢。所以失败只告警，明天再试。
      - name: Keep scheduled workflow alive
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- output/latest.json; then
            echo "latest.json 无变化，跳过提交"
            exit 0
          fi
          git add output/latest.json
          git commit -m "chore: 更新当日新闻快照 $(date -u +%Y-%m-%d)"
          # 显式指定 ref：不依赖 checkout 是否处于分支状态，
          # 也不会在从非默认分支手动触发时误推到 main
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "已回写 latest.json"
          else
            echo "::warning::latest.json 回写失败（不影响本次发图）；若持续失败需检查 60 天保活"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
